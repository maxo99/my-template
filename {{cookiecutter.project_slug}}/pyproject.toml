[project]
name = "{{ cookiecutter.project_slug }}"
version = "0.1.0"
requires-python = ">={{ cookiecutter.python_version }}"

[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"


[tool.hatch.build.targets.wheel]
packages = ["src/{{ cookiecutter.package_name }}"]

[dependency-groups]
dev = [
    "pytest>=7.0.0",
{% if cookiecutter.use_pyright %}
  "pyright>=1.1.0",
{% endif %}
{% if cookiecutter.use_precommit %}
  "pre-commit>=4.0.0",
{% endif %}
]

[tool.ruff]
line-length = 88
target-version = "{{ cookiecutter.ruff_target_version }}"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.format]
quote-style = "double"


[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.pylint.messages_control]
disable = [
    "C0114", # missing-module-docstring
    "C0115", # missing-class-docstring
    "C0116", # missing-function-docstring
    "R0903", # too-few-public-methods
    "R0913", # too-many-arguments
    "R0914", # too-many-locals
    "W1203", # logging-format-interpolation
    "W0718", # exception-escape
    "W0511", # TODOs
]

[tool.pylint.format]
max-line-length = 100

[tool.pylint.basic]
good-names = [
    "i",
    "j",
    "k",
    "ex",
    "Run",
    "_",
    "x",
    "y",
    "z",
    "id",
    "db",
    "pk",
    "ok",
]

[tool.pylint.design]
max-args = 8
max-locals = 20
max-returns = 6
max-branches = 12

[tool.pyright]
include = ["src"]
exclude = [
    "outputs/",
    "doc",
    "**/node_modules",
    "**/cdk.out",
    "**/.pytest_cache",
    "**/build",
    "**/dist",
    "**/.vscode",
    "**/__pycache__",
    "**/*.egg-info",
    "**/*.ruff_cache",

]

